# PHANTOM + Earth Memory · NASA Space Apps 2026 · Stellar Horizons
# Un solo comando en cmd, PowerShell o bash (rutas relativas a esta carpeta):
#   docker compose run --rm phantom     # análisis PHANTOM (dos regiones, MODIS)
#   docker compose run --rm nacional    # Earth Memory nacional: todo el país, a nivel de celda
services:
  phantom:
    build: .
    image: phantom:latest
    volumes:
      - ./out:/app/out                        # results/, figures/ y RESULTS.md
      - ./data/appeears:/app/data/appeears    # CSV de AppEEARS (si ya están)

  # Earth Memory nacional (IMERG 0.1° + GLDAS 0.25°; NASA POWER como comprobación).
  # Descarga solo lo que falta en data/nacional/ (caché con SHA-256), corre los dos motores, figuras, informe
  # y cuadernos. Otro país: docker compose run --rm nacional --pais HTI
  # El token de Earthdata (.secrets/earthdata_token) se monta SOLO en tiempo de ejecución y de solo lectura;
  # no entra a la imagen (.dockerignore excluye .secrets). Sin token, usa lo que ya esté en caché.
  nacional:
    build: .
    image: phantom:latest
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.run_all"]
    command: []
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./data/nacional:/app/data/nacional
      - ./data/appeears:/app/data/appeears
      - ./results/nacional:/app/results/nacional
      - ./figures/nacional:/app/figures/nacional
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks

  # Alta resolución + umbrales críticos (earthmemory/hr): CHIRPS 0.05°, TerraClimate ~4 km, SoilGrids, Copernicus
  # DEM, WorldCover y SMAP L4 9 km (NASA, si hay token). Descarga lo que falta en data/nacional_hr/ (manifiesto con
  # SHA-256), analiza, hace figuras, informe y cuaderno 05. Lee data/nacional SOLO para comparar con IMERG/GLDAS.
  #   docker compose run --rm alta_resolucion            (añadir --sin-descarga para usar solo la caché)
  alta_resolucion:
    build: .
    image: phantom:latest
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.hr.run"]
    command: []
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./data/nacional_hr:/app/data/nacional_hr
      - ./data/nacional:/app/data/nacional:ro
      - ./results/nacional_hr:/app/results/nacional_hr
      - ./figures/nacional_hr:/app/figures/nacional_hr
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks

  # ── Evidence Intelligence (2026-11-14): cuatro motores que corren en paralelo. ──
  # El código se monta desde el disco (no hace falta reconstruir la imagen). Cada motor escribe SOLO en su carpeta
  # de data/, results/ y figures/; lee todo lo demás en solo lectura.
  #   docker compose run --rm tendencias   # P0: tendencias de sequía y lluvia extrema, con significancia
  #   docker compose run --rm auditoria    # auditoría de confianza: procedencia, desacuerdos y decisiones que cambian
  #   docker compose run --rm yuna         # caso Yuna: cuenca, presa de Hatillo, inundaciones observadas
  #   docker compose run --rm testigos     # testigos independientes (SMAP L3) y pruebas de hipótesis
  tendencias: &motor
    image: phantom:latest
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.tendencias.run"]
    command: []
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./earthmemory:/app/earthmemory:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./data/tendencias:/app/data/tendencias
      - ./results/tendencias:/app/results/tendencias
      - ./figures/tendencias:/app/figures/tendencias
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks
  auditoria:
    <<: *motor
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.auditoria.run"]
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./earthmemory:/app/earthmemory:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./data/auditoria:/app/data/auditoria
      - ./results/auditoria:/app/results/auditoria
      - ./figures/auditoria:/app/figures/auditoria
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks
  yuna:
    <<: *motor
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.yuna.run"]
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./earthmemory:/app/earthmemory:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./data/yuna:/app/data/yuna
      - ./results/yuna:/app/results/yuna
      - ./figures/yuna:/app/figures/yuna
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks
  testigos:
    <<: *motor
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.testigos.run"]
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./earthmemory:/app/earthmemory:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./data/testigos:/app/data/testigos
      - ./results/testigos:/app/results/testigos
      - ./figures/testigos:/app/figures/testigos
      - ./reports_nacional:/app/reports_nacional
      - ./notebooks:/app/notebooks
  # Galería: figuras de impacto visual (no estándar) a partir de los resultados ya verificados. Solo lee datos.
  #   docker compose run --rm galeria
  galeria:
    <<: *motor
    entrypoint: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "earthmemory.galeria.run"]
    volumes:
      - ./earthmemory:/app/earthmemory:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./results:/app/results:ro
      - ./figures/galeria:/app/figures/galeria
