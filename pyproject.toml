[project]
name = "phantom"
version = "0.1.0"
description = "PHANTOM: brecha entre recuperación visual y funcional de la vegetación tras sequías (NASA Space Apps 2026, Stellar Horizons)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
