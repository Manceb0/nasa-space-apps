[project]
name = "phantom"
version = "0.1.0"
description = "PHANTOM + Earth Memory: memoria del agua en el terreno y recuperación tras sequías (NASA Space Apps 2026, Stellar Horizons)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "rasterio>=1.4",
    "h5py>=3.11",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "shapely>=2.0",
    "pyshp>=2.3",
    "statsmodels>=0.14",
    "pyhdf>=0.11",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
